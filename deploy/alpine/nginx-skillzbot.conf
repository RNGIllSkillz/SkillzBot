# /etc/nginx/http.d/skillzbot.conf - web panel: static files + /api proxied to the bot on this host.
# Put your TLS reverse proxy (and Authentik, if wanted) in front of this port.
server {
    listen 80 default_server;
    server_name _;
    root @APP_DIR@/web;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:@API_PORT@/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        # Server-Sent Events: no buffering, long-lived connections.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
