# Example wiring of the panel next to the bot. On TrueNAS the bot is its own app; the point is
# that the panel container must reach the bot's API port (ApiPort, default 8080) under the
# name given in BOT_UPSTREAM, and that the panel's domain terminates TLS in front of it.
services:
  skillzbot-web:
    build: ../web
    image: skillzbot-web:latest
    restart: unless-stopped
    environment:
      BOT_UPSTREAM: "skillzbot:8080"   # host:port where the bot container answers
    ports:
      - "8081:80"                       # put your reverse proxy / Authentik in front of this
